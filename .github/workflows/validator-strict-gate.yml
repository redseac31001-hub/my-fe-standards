name: Validator Strict Gate

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validator scope to run in strict mode
        required: true
        default: all
        type: choice
        options:
          - all
          - rules
          - skills

jobs:
  validator-strict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build validator entrypoints
        run: npm run build:scripts

      - name: Run strict validator gate
        run: npm run validate:gate:strict -- --scope ${{ inputs.scope }} --json --out-dir artifacts/validator-strict-gate

      - name: Upload validator strict reports
        uses: actions/upload-artifact@v4
        with:
          name: validator-strict-gate-${{ inputs.scope }}
          path: artifacts/validator-strict-gate
          if-no-files-found: error
