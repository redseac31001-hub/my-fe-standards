<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 25pt 40pt; flex: 1; display: flex; gap: 30pt; }
.strategy-col { flex: 1; }
.strategy-title { color: #1C2833; font-size: 16pt; font-weight: bold; margin-bottom: 15pt; padding-bottom: 10pt; border-bottom: 2pt solid #3498DB; }
.strategy-item { background: #F8F9FA; padding: 15pt; margin-bottom: 12pt; border-radius: 6pt; }
.item-title { color: #3498DB; font-size: 13pt; font-weight: bold; margin-bottom: 8pt; }
.item-desc { color: #2C3E50; font-size: 11pt; line-height: 1.5; }
.benefit-box { background: #2ECC71; padding: 15pt; border-radius: 6pt; margin-top: 15pt; }
.benefit-text { color: #FFFFFF; font-size: 12pt; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">渐进式加载策略</h1>
</div>
<div class="content">
  <div class="strategy-col">
    <p class="strategy-title">Eager 立即加载</p>
    <div class="strategy-item">
      <p class="item-title">Layer 1 基础规范</p>
      <p class="item-desc">直接嵌入 project-rules.md，核心规范常驻内存</p>
    </div>
    <div class="strategy-item">
      <p class="item-title">适用场景</p>
      <p class="item-desc">代码质量、架构规范、TypeScript 类型等通用规则</p>
    </div>
  </div>
  <div class="strategy-col">
    <p class="strategy-title">Lazy 按需加载</p>
    <div class="strategy-item">
      <p class="item-title">Layer 2/3 规范</p>
      <p class="item-desc">生成索引，缓存到 .codebuddy/rules_cache/</p>
    </div>
    <div class="strategy-item">
      <p class="item-title">适用场景</p>
      <p class="item-desc">UI 库规范、任务检查清单，根据任务类型动态加载</p>
    </div>
  </div>
</div>
</body>
</html>
