<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #16A085; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 20pt 40pt; flex: 1; }
.section-title { color: #1C2833; font-size: 14pt; font-weight: bold; margin-bottom: 15pt; }
.command-box { background: #1C2833; padding: 12pt 15pt; border-radius: 6pt; margin-bottom: 15pt; }
.command-text { color: #2ECC71; font-size: 12pt; font-family: Courier New, monospace; }
.task-flow { display: flex; gap: 10pt; flex-wrap: wrap; }
.task-step { background: #F8F9FA; padding: 12pt; border-radius: 6pt; width: 200pt; }
.step-header { display: flex; align-items: center; gap: 8pt; margin-bottom: 8pt; }
.step-number { background: #E74C3C; color: #FFFFFF; width: 20pt; height: 20pt; border-radius: 50%; font-size: 10pt; text-align: center; line-height: 20pt; }
.step-title { color: #1C2833; font-size: 11pt; font-weight: bold; }
.step-desc { color: #2C3E50; font-size: 9pt; line-height: 1.4; }
.step-status { margin-top: 8pt; font-size: 9pt; }
.status-done { color: #2ECC71; }
.status-progress { color: #F39C12; }
.status-pending { color: #7F8C8D; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">/task 命令演示</h1>
</div>
<div class="content">
  <p class="section-title">计划任务执行示例</p>
  <div class="command-box">
    <p class="command-text">/task 实现用户登录功能</p>
  </div>
  <div class="task-flow">
    <div class="task-step">
      <div class="step-header">
        <p class="step-number">1</p>
        <p class="step-title">需求分析</p>
      </div>
      <p class="step-desc">解析登录功能需求，识别关键模块</p>
      <p class="step-status status-done">已完成</p>
    </div>
    <div class="task-step">
      <div class="step-header">
        <p class="step-number">2</p>
        <p class="step-title">API 设计</p>
      </div>
      <p class="step-desc">设计登录接口，定义请求/响应格式</p>
      <p class="step-status status-done">已完成</p>
    </div>
    <div class="task-step">
      <div class="step-header">
        <p class="step-number">3</p>
        <p class="step-title">组件开发</p>
      </div>
      <p class="step-desc">实现 LoginForm 组件，表单验证</p>
      <p class="step-status status-progress">进行中</p>
    </div>
    <div class="task-step">
      <div class="step-header">
        <p class="step-number">4</p>
        <p class="step-title">状态管理</p>
      </div>
      <p class="step-desc">Pinia Store 用户状态管理</p>
      <p class="step-status status-pending">待执行</p>
    </div>
    <div class="task-step">
      <div class="step-header">
        <p class="step-number">5</p>
        <p class="step-title">测试验证</p>
      </div>
      <p class="step-desc">单元测试 + 集成测试</p>
      <p class="step-status status-pending">待执行</p>
    </div>
    <div class="task-step">
      <div class="step-header">
        <p class="step-number">6</p>
        <p class="step-title">验收报告</p>
      </div>
      <p class="step-desc">生成验收报告，请求确认</p>
      <p class="step-status status-pending">待执行</p>
    </div>
  </div>
</div>
</body>
</html>
