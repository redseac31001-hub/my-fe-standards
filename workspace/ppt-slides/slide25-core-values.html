<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 25pt 40pt; flex: 1; }
.section-title { color: #1C2833; font-size: 18pt; font-weight: bold; margin-bottom: 20pt; }
.values-grid { display: flex; gap: 20pt; }
.value-card { flex: 1; background: #F8F9FA; border-radius: 8pt; overflow: hidden; }
.value-header { padding: 20pt; text-align: center; }
.v1 { background: #3498DB; }
.v2 { background: #2ECC71; }
.v3 { background: #F39C12; }
.v4 { background: #9B59B6; }
.value-icon { color: #FFFFFF; font-size: 28pt; font-weight: bold; }
.value-title { color: #FFFFFF; font-size: 14pt; font-weight: bold; margin-top: 10pt; }
.value-content { padding: 15pt; }
.value-desc { color: #2C3E50; font-size: 11pt; line-height: 1.5; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">核心价值</h1>
</div>
<div class="content">
  <p class="section-title">my-fe-standards 带来的四大核心优势</p>
  <div class="values-grid">
    <div class="value-card">
      <div class="value-header v1">
        <p class="value-icon">1</p>
        <p class="value-title">知识复用</p>
      </div>
      <div class="value-content">
        <p class="value-desc">一套规则库支持多个项目，避免重复维护</p>
      </div>
    </div>
    <div class="value-card">
      <div class="value-header v2">
        <p class="value-icon">2</p>
        <p class="value-title">智能分发</p>
      </div>
      <div class="value-content">
        <p class="value-desc">自动检测技术栈，动态加载对应规则</p>
      </div>
    </div>
    <div class="value-card">
      <div class="value-header v3">
        <p class="value-icon">3</p>
        <p class="value-title">完整工作流</p>
      </div>
      <div class="value-content">
        <p class="value-desc">从需求分解到验收闭环的端到端自动化</p>
      </div>
    </div>
    <div class="value-card">
      <div class="value-header v4">
        <p class="value-icon">4</p>
        <p class="value-title">项目记忆</p>
      </div>
      <div class="value-content">
        <p class="value-desc">持久化分析结果，追踪项目质量趋势</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
