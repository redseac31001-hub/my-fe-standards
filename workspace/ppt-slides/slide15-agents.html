<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 25pt 40pt; flex: 1; }
.section-title { color: #1C2833; font-size: 16pt; font-weight: bold; margin-bottom: 20pt; }
.agents-grid { display: flex; gap: 15pt; }
.agent-card { flex: 1; background: #F8F9FA; border-radius: 8pt; overflow: hidden; }
.agent-header { padding: 15pt; text-align: center; }
.orchestrator { background: #E74C3C; }
.analyzer { background: #3498DB; }
.security { background: #2ECC71; }
.performance { background: #F39C12; }
.planner { background: #9B59B6; }
.agent-name { color: #FFFFFF; font-size: 12pt; font-weight: bold; }
.agent-version { color: #FFFFFF; font-size: 9pt; opacity: 0.8; margin-top: 3pt; }
.agent-content { padding: 12pt; }
.agent-desc { color: #2C3E50; font-size: 10pt; line-height: 1.5; }
.agent-trigger { color: #7F8C8D; font-size: 9pt; margin-top: 8pt; font-style: italic; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">Agent 系统</h1>
</div>
<div class="content">
  <p class="section-title">5 个智能代理，自动化执行复杂任务</p>
  <div class="agents-grid">
    <div class="agent-card">
      <div class="agent-header orchestrator">
        <p class="agent-name">Task Orchestrator</p>
        <p class="agent-version">v2.2.0</p>
      </div>
      <div class="agent-content">
        <p class="agent-desc">端到端计划任务编排，7 阶段工作流</p>
        <p class="agent-trigger">/task 命令触发</p>
      </div>
    </div>
    <div class="agent-card">
      <div class="agent-header analyzer">
        <p class="agent-name">Structure Analyzer</p>
        <p class="agent-version">v2.1.0</p>
      </div>
      <div class="agent-content">
        <p class="agent-desc">目录反模式检测、健康度评分</p>
        <p class="agent-trigger">结构分析触发</p>
      </div>
    </div>
    <div class="agent-card">
      <div class="agent-header security">
        <p class="agent-name">Security Reviewer</p>
        <p class="agent-version">v1.0.0</p>
      </div>
      <div class="agent-content">
        <p class="agent-desc">XSS/CSRF/OWASP 漏洞检测</p>
        <p class="agent-trigger">安全审查触发</p>
      </div>
    </div>
    <div class="agent-card">
      <div class="agent-header performance">
        <p class="agent-name">Performance Profiler</p>
        <p class="agent-version">v1.0.0</p>
      </div>
      <div class="agent-content">
        <p class="agent-desc">Lighthouse/Web Vitals 诊断</p>
        <p class="agent-trigger">性能分析触发</p>
      </div>
    </div>
    <div class="agent-card">
      <div class="agent-header planner">
        <p class="agent-name">Planner</p>
        <p class="agent-version">v1.0.0</p>
      </div>
      <div class="agent-content">
        <p class="agent-desc">复杂任务分解与风险评估</p>
        <p class="agent-trigger">规划命令触发</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
