<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 25pt 40pt; flex: 1; display: flex; gap: 25pt; }
.left-col { flex: 1; }
.right-col { flex: 1; }
.section-title { color: #1C2833; font-size: 16pt; font-weight: bold; margin-bottom: 15pt; }
.manifest-box { background: #1C2833; padding: 15pt; border-radius: 6pt; font-family: Courier New, monospace; }
.code-line { color: #2ECC71; font-size: 9pt; line-height: 1.6; }
.feature-list { margin-top: 10pt; }
.feature-item { background: #F8F9FA; padding: 12pt; margin-bottom: 10pt; border-left: 3pt solid #3498DB; }
.feature-title { color: #3498DB; font-size: 12pt; font-weight: bold; }
.feature-desc { color: #2C3E50; font-size: 10pt; margin-top: 5pt; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">manifest.json 资源清单</h1>
</div>
<div class="content">
  <div class="left-col">
    <p class="section-title">清单结构示例</p>
    <div class="manifest-box">
      <p class="code-line">{</p>
      <p class="code-line">  "version": "2.3.0",</p>
      <p class="code-line">  "generated": "2026-01-30",</p>
      <p class="code-line">  "stats": {</p>
      <p class="code-line">    "totalFiles": 74,</p>
      <p class="code-line">    "rules": 17,</p>
      <p class="code-line">    "skills": 12,</p>
      <p class="code-line">    "agents": 5</p>
      <p class="code-line">  },</p>
      <p class="code-line">  "ruleRelevance": {...}</p>
      <p class="code-line">}</p>
    </div>
  </div>
  <div class="right-col">
    <p class="section-title">核心功能</p>
    <div class="feature-list">
      <div class="feature-item">
        <p class="feature-title">资源索引</p>
        <p class="feature-desc">所有规则、技能、Agent 文件的完整索引</p>
      </div>
      <div class="feature-item">
        <p class="feature-title">任务相关性</p>
        <p class="feature-desc">规则与任务类型的相关性评分 (0-1)</p>
      </div>
      <div class="feature-item">
        <p class="feature-title">远程支持</p>
        <p class="feature-desc">支持 HTTP 获取清单，实现远程模式</p>
      </div>
      <div class="feature-item">
        <p class="feature-title">版本管理</p>
        <p class="feature-desc">支持增量更新和版本追踪</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
