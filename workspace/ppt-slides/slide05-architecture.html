<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 25pt 40pt; flex: 1; }
.arch-container { display: flex; flex-direction: column; gap: 12pt; }
.arch-layer { display: flex; align-items: center; gap: 15pt; }
.layer-box { padding: 12pt 20pt; border-radius: 6pt; flex: 1; }
.layer-user { background: #3498DB; }
.layer-loader { background: #2ECC71; }
.layer-core { background: #F39C12; }
.layer-memory { background: #9B59B6; }
.layer-title { color: #FFFFFF; font-size: 14pt; font-weight: bold; margin-bottom: 5pt; }
.layer-desc { color: #FFFFFF; font-size: 10pt; }
.arrow { color: #1C2833; font-size: 20pt; font-weight: bold; }
.core-items { display: flex; gap: 10pt; margin-top: 8pt; }
.core-item { background: #FFFFFF; color: #F39C12; padding: 5pt 10pt; font-size: 9pt; border-radius: 3pt; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">整体架构图</h1>
</div>
<div class="content">
  <div class="arch-container">
    <div class="arch-layer">
      <div class="layer-box layer-user">
        <p class="layer-title">用户接入层</p>
        <p class="layer-desc">CodeBuddy / Claude Code / Amp / Cursor</p>
      </div>
    </div>
    <p class="arrow">↓</p>
    <div class="arch-layer">
      <div class="layer-box layer-loader">
        <p class="layer-title">规则加载器 (codebuddy-loader)</p>
        <p class="layer-desc">技术栈检测 → 三层规则加载 → 工具分发 → 配置生成</p>
      </div>
    </div>
    <p class="arrow">↓</p>
    <div class="arch-layer">
      <div class="layer-box layer-core">
        <p class="layer-title">核心能力层</p>
        <div class="core-items">
          <p class="core-item">Rules 规则</p>
          <p class="core-item">Skills 技能</p>
          <p class="core-item">Agents 代理</p>
          <p class="core-item">Workflows 工作流</p>
        </div>
      </div>
    </div>
    <p class="arrow">↓</p>
    <div class="arch-layer">
      <div class="layer-box layer-memory">
        <p class="layer-title">项目记忆系统 (Reports)</p>
        <p class="layer-desc">架构快照 | 模块图谱 | 健康度时间线 | 差异对比</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
