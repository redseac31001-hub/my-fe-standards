<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #9B59B6; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 25pt 40pt; flex: 1; display: flex; gap: 25pt; }
.chart-area { flex: 1.5; background: #F8F9FA; padding: 20pt; border-radius: 8pt; }
.chart-title { color: #1C2833; font-size: 14pt; font-weight: bold; margin-bottom: 15pt; }
.ascii-chart { font-family: Courier New, monospace; font-size: 10pt; color: #2C3E50; line-height: 1.4; }
.info-area { flex: 1; }
.info-title { color: #1C2833; font-size: 14pt; font-weight: bold; margin-bottom: 15pt; }
.info-item { background: #F8F9FA; padding: 12pt; margin-bottom: 10pt; border-left: 3pt solid #2ECC71; }
.info-label { color: #7F8C8D; font-size: 10pt; }
.info-value { color: #2ECC71; font-size: 16pt; font-weight: bold; margin-top: 5pt; }
.trend-up { color: #2ECC71; }
.trend-down { color: #E74C3C; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">健康度时间线</h1>
</div>
<div class="content">
  <div class="chart-area">
    <p class="chart-title">项目健康度趋势 (最近 7 天)</p>
    <p class="ascii-chart">100 |</p>
    <p class="ascii-chart"> 90 |          *----*----*</p>
    <p class="ascii-chart"> 80 |     *----*</p>
    <p class="ascii-chart"> 70 |*----*</p>
    <p class="ascii-chart"> 60 |</p>
    <p class="ascii-chart"> 50 |</p>
    <p class="ascii-chart">    +------------------------</p>
    <p class="ascii-chart">     01/24 01/25 01/26 01/27 01/28 01/29 01/30</p>
  </div>
  <div class="info-area">
    <p class="info-title">健康度指标</p>
    <div class="info-item">
      <p class="info-label">当前健康度</p>
      <p class="info-value trend-up">92 / 100</p>
    </div>
    <div class="info-item">
      <p class="info-label">7 天变化</p>
      <p class="info-value trend-up">+22 分</p>
    </div>
    <div class="info-item">
      <p class="info-label">趋势预测</p>
      <p class="info-value trend-up">持续上升</p>
    </div>
    <div class="info-item">
      <p class="info-label">违规项</p>
      <p class="info-value">3 项待修复</p>
    </div>
  </div>
</div>
</body>
</html>
