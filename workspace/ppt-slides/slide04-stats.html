<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 30pt 40pt; flex: 1; }
.section-title { color: #1C2833; font-size: 20pt; font-weight: bold; margin-bottom: 25pt; }
.stats-grid { display: flex; gap: 20pt; flex-wrap: wrap; }
.stat-item { width: 140pt; background: #F8F9FA; padding: 20pt; text-align: center; border-top: 4pt solid #3498DB; }
.stat-number { color: #3498DB; font-size: 36pt; font-weight: bold; }
.stat-label { color: #2C3E50; font-size: 12pt; margin-top: 8pt; }
.tech-stack { margin-top: 25pt; display: flex; gap: 15pt; }
.tech-item { background: #1C2833; color: #FFFFFF; padding: 8pt 16pt; font-size: 11pt; border-radius: 4pt; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">项目统计</h1>
</div>
<div class="content">
  <p class="section-title">my-fe-standards v2.3.0 资源概览</p>
  <div class="stats-grid">
    <div class="stat-item">
      <p class="stat-number">74</p>
      <p class="stat-label">总文件数</p>
    </div>
    <div class="stat-item">
      <p class="stat-number">17</p>
      <p class="stat-label">规则文件</p>
    </div>
    <div class="stat-item">
      <p class="stat-number">12</p>
      <p class="stat-label">专业技能</p>
    </div>
    <div class="stat-item">
      <p class="stat-number">5</p>
      <p class="stat-label">智能 Agent</p>
    </div>
    <div class="stat-item">
      <p class="stat-number">3</p>
      <p class="stat-label">Workflow</p>
    </div>
  </div>
  <div class="tech-stack">
    <p class="tech-item">TypeScript 5.x</p>
    <p class="tech-item">Node.js ES2018+</p>
    <p class="tech-item">MCP Server</p>
    <p class="tech-item">CommonJS</p>
  </div>
</div>
</body>
</html>
