<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 30pt 40pt; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.solution-box { background: #3498DB; padding: 30pt 50pt; border-radius: 8pt; text-align: center; }
.solution-title { color: #FFFFFF; font-size: 24pt; font-weight: bold; margin-bottom: 15pt; }
.solution-desc { color: #FFFFFF; font-size: 16pt; line-height: 1.6; }
.features { display: flex; gap: 30pt; margin-top: 30pt; }
.feature { text-align: center; }
.feature-icon { color: #3498DB; font-size: 32pt; font-weight: bold; }
.feature-text { color: #2C3E50; font-size: 14pt; margin-top: 10pt; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">解决方案</h1>
</div>
<div class="content">
  <div class="solution-box">
    <p class="solution-title">my-fe-standards</p>
    <p class="solution-desc">一套完整的 AI 辅助开发平台<br/>为 CodeBuddy GLM-4.7 提供统一的知识源与执行框架</p>
  </div>
  <div class="features">
    <div class="feature">
      <p class="feature-icon">1</p>
      <p class="feature-text">一键加载规则</p>
    </div>
    <div class="feature">
      <p class="feature-icon">2</p>
      <p class="feature-text">自动检测技术栈</p>
    </div>
    <div class="feature">
      <p class="feature-icon">3</p>
      <p class="feature-text">智能分发工具</p>
    </div>
    <div class="feature">
      <p class="feature-icon">4</p>
      <p class="feature-text">完整工作流</p>
    </div>
  </div>
</div>
</body>
</html>
