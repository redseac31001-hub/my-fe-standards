<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #9B59B6; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 25pt 40pt; flex: 1; display: flex; gap: 25pt; }
.left-col { flex: 1; }
.right-col { flex: 1.2; }
.section-title { color: #1C2833; font-size: 16pt; font-weight: bold; margin-bottom: 15pt; }
.dir-tree { background: #1C2833; padding: 15pt; border-radius: 6pt; font-family: Courier New, monospace; }
.tree-line { color: #2ECC71; font-size: 9pt; line-height: 1.6; }
.feature-grid { display: flex; flex-wrap: wrap; gap: 12pt; }
.feature-card { width: 140pt; background: #F8F9FA; padding: 15pt; border-radius: 6pt; border-top: 3pt solid #9B59B6; }
.feature-title { color: #9B59B6; font-size: 12pt; font-weight: bold; margin-bottom: 8pt; }
.feature-desc { color: #2C3E50; font-size: 10pt; line-height: 1.4; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">项目记忆系统</h1>
</div>
<div class="content">
  <div class="left-col">
    <p class="section-title">报告目录结构</p>
    <div class="dir-tree">
      <p class="tree-line">.codebuddy/reports/</p>
      <p class="tree-line">├── manifest.json</p>
      <p class="tree-line">├── architecture/</p>
      <p class="tree-line">│   ├── latest.json</p>
      <p class="tree-line">│   └── 2026-01-29.json</p>
      <p class="tree-line">├── modules/</p>
      <p class="tree-line">│   └── latest.json</p>
      <p class="tree-line">└── health/</p>
      <p class="tree-line">    └── timeline.json</p>
    </div>
  </div>
  <div class="right-col">
    <p class="section-title">核心功能</p>
    <div class="feature-grid">
      <div class="feature-card">
        <p class="feature-title">架构快照</p>
        <p class="feature-desc">健康度评分、违规项、结构类型</p>
      </div>
      <div class="feature-card">
        <p class="feature-title">模块图谱</p>
        <p class="feature-desc">模块列表、依赖图、业务分类</p>
      </div>
      <div class="feature-card">
        <p class="feature-title">健康度时间线</p>
        <p class="feature-desc">每日数据点、趋势预测</p>
      </div>
      <div class="feature-card">
        <p class="feature-title">差异对比</p>
        <p class="feature-desc">快照对比、变更检测</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
