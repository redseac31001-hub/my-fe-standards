<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 25pt 40pt; flex: 1; display: flex; gap: 25pt; }
.left-col { flex: 1; }
.right-col { flex: 1.2; }
.section-title { color: #1C2833; font-size: 16pt; font-weight: bold; margin-bottom: 15pt; }
.collab-flow { background: #F8F9FA; padding: 20pt; border-radius: 8pt; }
.flow-item { display: flex; align-items: center; gap: 10pt; margin-bottom: 12pt; }
.flow-agent { background: #3498DB; color: #FFFFFF; padding: 8pt 12pt; font-size: 10pt; border-radius: 4pt; width: 100pt; text-align: center; }
.flow-arrow { color: #1C2833; font-size: 14pt; }
.flow-action { color: #2C3E50; font-size: 10pt; flex: 1; }
.feature-list { margin-top: 15pt; }
.feature-item { background: #F8F9FA; padding: 12pt; margin-bottom: 10pt; border-left: 3pt solid #2ECC71; }
.feature-title { color: #2ECC71; font-size: 12pt; font-weight: bold; }
.feature-desc { color: #2C3E50; font-size: 10pt; margin-top: 5pt; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">Agent 协作</h1>
</div>
<div class="content">
  <div class="left-col">
    <p class="section-title">多 Agent 编排示例</p>
    <div class="collab-flow">
      <div class="flow-item">
        <p class="flow-agent">Task Orchestrator</p>
        <p class="flow-arrow">→</p>
        <p class="flow-action">接收任务，分解需求</p>
      </div>
      <div class="flow-item">
        <p class="flow-agent">Planner</p>
        <p class="flow-arrow">→</p>
        <p class="flow-action">制定实现计划</p>
      </div>
      <div class="flow-item">
        <p class="flow-agent">Structure Analyzer</p>
        <p class="flow-arrow">→</p>
        <p class="flow-action">分析项目结构</p>
      </div>
      <div class="flow-item">
        <p class="flow-agent">Security Reviewer</p>
        <p class="flow-arrow">→</p>
        <p class="flow-action">安全检查</p>
      </div>
      <div class="flow-item">
        <p class="flow-agent">Task Orchestrator</p>
        <p class="flow-arrow">→</p>
        <p class="flow-action">汇总结果，生成报告</p>
      </div>
    </div>
  </div>
  <div class="right-col">
    <p class="section-title">协作特性</p>
    <div class="feature-list">
      <div class="feature-item">
        <p class="feature-title">并行执行</p>
        <p class="feature-desc">无依赖任务自动并行，提升效率</p>
      </div>
      <div class="feature-item">
        <p class="feature-title">阻塞处理</p>
        <p class="feature-desc">遇到阻塞暂停，等待用户介入</p>
      </div>
      <div class="feature-item">
        <p class="feature-title">任务持久化</p>
        <p class="feature-desc">TaskBook 可恢复，支持中断继续</p>
      </div>
      <div class="feature-item">
        <p class="feature-title">变更追踪</p>
        <p class="feature-desc">实时记录偏离原计划的改动</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
