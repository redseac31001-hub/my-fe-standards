<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #16A085; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 20pt 40pt; flex: 1; }
.section-title { color: #1C2833; font-size: 14pt; font-weight: bold; margin-bottom: 15pt; }
.review-box { background: #F8F9FA; padding: 15pt; border-radius: 8pt; border-left: 4pt solid #3498DB; }
.review-header { color: #3498DB; font-size: 12pt; font-weight: bold; margin-bottom: 10pt; }
.review-content { display: flex; gap: 20pt; }
.review-col { flex: 1; }
.review-item { margin-bottom: 8pt; }
.review-label { color: #7F8C8D; font-size: 9pt; }
.review-value { color: #2C3E50; font-size: 10pt; margin-top: 2pt; }
.score-box { background: #2ECC71; color: #FFFFFF; padding: 10pt 15pt; border-radius: 6pt; text-align: center; margin-top: 10pt; }
.score-label { font-size: 10pt; }
.score-value { font-size: 24pt; font-weight: bold; }
.issues-list { margin-top: 15pt; }
.issue-item { background: #FEF9E7; padding: 8pt 12pt; margin-bottom: 6pt; border-left: 3pt solid #F39C12; font-size: 10pt; color: #2C3E50; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">实际效果 - 代码审查</h1>
</div>
<div class="content">
  <p class="section-title">frontend-code-review 技能输出示例</p>
  <div class="review-box">
    <p class="review-header">代码审查报告 - UserProfile.vue</p>
    <div class="review-content">
      <div class="review-col">
        <div class="review-item">
          <p class="review-label">业务逻辑</p>
          <p class="review-value">符合需求，边界处理完善</p>
        </div>
        <div class="review-item">
          <p class="review-label">代码质量</p>
          <p class="review-value">命名规范，函数职责单一</p>
        </div>
        <div class="review-item">
          <p class="review-label">性能</p>
          <p class="review-value">无明显性能问题</p>
        </div>
      </div>
      <div class="review-col">
        <div class="review-item">
          <p class="review-label">可维护性</p>
          <p class="review-value">结构清晰，易于扩展</p>
        </div>
        <div class="review-item">
          <p class="review-label">测试覆盖</p>
          <p class="review-value">建议补充单元测试</p>
        </div>
        <div class="score-box">
          <p class="score-label">综合评分</p>
          <p class="score-value">85/100</p>
        </div>
      </div>
    </div>
  </div>
  <div class="issues-list">
    <p class="issue-item">建议: 第 45 行的 computed 可以提取为独立函数</p>
    <p class="issue-item">建议: 考虑添加 loading 状态处理</p>
  </div>
</div>
</body>
</html>
