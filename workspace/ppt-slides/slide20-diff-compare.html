<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #9B59B6; padding: 20pt 40pt; }
.header-title { color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0; }
.content { padding: 25pt 40pt; flex: 1; display: flex; gap: 25pt; }
.diff-col { flex: 1; }
.diff-title { color: #1C2833; font-size: 14pt; font-weight: bold; margin-bottom: 15pt; padding-bottom: 8pt; border-bottom: 2pt solid #9B59B6; }
.diff-card { background: #F8F9FA; padding: 15pt; border-radius: 6pt; margin-bottom: 12pt; }
.diff-header { display: flex; justify-content: space-between; margin-bottom: 10pt; }
.diff-label { color: #7F8C8D; font-size: 10pt; }
.diff-value { font-size: 12pt; font-weight: bold; }
.added { color: #2ECC71; }
.removed { color: #E74C3C; }
.changed { color: #F39C12; }
.diff-detail { color: #2C3E50; font-size: 10pt; line-height: 1.5; }
.summary-box { background: #1C2833; padding: 15pt; border-radius: 6pt; margin-top: 15pt; }
.summary-text { color: #FFFFFF; font-size: 11pt; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">差异对比</h1>
</div>
<div class="content">
  <div class="diff-col">
    <p class="diff-title">快照对比 (01/29 vs 01/30)</p>
    <div class="diff-card">
      <div class="diff-header">
        <p class="diff-label">新增模块</p>
        <p class="diff-value added">+2</p>
      </div>
      <p class="diff-detail">features/payment, features/notification</p>
    </div>
    <div class="diff-card">
      <div class="diff-header">
        <p class="diff-label">删除模块</p>
        <p class="diff-value removed">-1</p>
      </div>
      <p class="diff-detail">legacy/old-auth (已迁移)</p>
    </div>
    <div class="diff-card">
      <div class="diff-header">
        <p class="diff-label">修改模块</p>
        <p class="diff-value changed">~3</p>
      </div>
      <p class="diff-detail">features/user, features/order, shared/utils</p>
    </div>
  </div>
  <div class="diff-col">
    <p class="diff-title">变更检测</p>
    <div class="diff-card">
      <div class="diff-header">
        <p class="diff-label">健康度变化</p>
        <p class="diff-value added">+5 分</p>
      </div>
      <p class="diff-detail">从 87 分提升到 92 分</p>
    </div>
    <div class="diff-card">
      <div class="diff-header">
        <p class="diff-label">违规项变化</p>
        <p class="diff-value added">-2 项</p>
      </div>
      <p class="diff-detail">修复了 2 个反模式问题</p>
    </div>
    <div class="summary-box">
      <p class="summary-text">本次变更整体向好，建议继续保持</p>
    </div>
  </div>
</div>
</body>
</html>
