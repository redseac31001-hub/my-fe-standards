<!DOCTYPE html>
<html>
<head>

body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C2833; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
}
.title { color: #FFFFFF; font-size: 48pt; font-weight: bold; margin-bottom: 30pt; }

.contact-info { color: #AAB7B8; font-size: 14pt; line-height: 1.8; }
.accent-line { width: 80pt; height: 3pt; background: #3498DB; margin: 20pt 0; }
</style>
</head>
<body>
<h1 class="title">Q&A</h1>
<div class="accent-line"></div>
<p class="subtitle">感谢聆听</p>
<div class="contact-box">
  <p class="contact-title">项目地址</p>

</body>
</html>
